[project]
name = "pachong"
version = "0.1.0"
description = "World-class distributed e-commerce scraping system"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pachong Team" }]

dependencies = [
    "aiohttp>=3.10",
    "aiokafka>=0.11",
    "aioboto3>=13.0",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis[hiredis]>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "structlog>=24.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "prometheus-client>=0.21",
    "playwright>=1.48",
    "nodriver>=0.34",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "brotli>=1.1",
    "lxml>=5.3",
    "orjson>=3.10",
    "python-dateutil>=2.9",
    "geoip2>=5.0",
    "tenacity>=9.0",
]

[project.scripts]
pachong = "pachong.cli.main:app"

[project.urls]
Homepage = "https://github.com/QWQZhangErHao/pachong"
Documentation = "https://github.com/QWQZhangErHao/pachong#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "locust>=2.32",
    "docker>=7.1",
    "testcontainers>=4.9",
    "pyinstaller>=6.0",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pachong"]
include = [
    "config/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "pachong/**/*.py",
    "config/*.yaml",
    "deploy/**/*.yml",
    "deploy/**/*.yaml",
    "deploy/**/*.json",
    "deploy/**/Dockerfile*",
    "tests/**/*.py",
    "scripts/**/*",
    "alembic.ini",
    "Makefile",
    "README.md",
    "demo.py",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
