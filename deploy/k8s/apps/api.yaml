apiVersion: v1
kind: Service
metadata:
  name: pachong-api
  namespace: pachong
  labels:
    app: pachong
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: pachong
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pachong-api
  namespace: pachong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pachong
      component: api
  template:
    metadata:
      labels:
        app: pachong
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: pachong:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pachong-config
            - secretRef:
                name: pachong-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
