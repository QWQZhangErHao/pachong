global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "pachong"
    static_configs:
      - targets: ["pachong-api:8000"]
        labels:
          service: "pachong"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
